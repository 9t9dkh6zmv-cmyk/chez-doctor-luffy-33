<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHEZ LUFFY 33</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 85px;

      background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.92)),
        url("IMG_1527.jpeg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* =========================
       ACCUEIL
    ========================= */

   .home {
  display: block;
  padding: 0 15px 20px;
}

    .home.active {
  display: block;
}


    /* =========================
       BANDE DÉFILANTE
    ========================= */

    .ticker {
      width: calc(100% + 30px);
      margin-left: -15px;

      overflow: hidden;
      white-space: nowrap;

      background: rgba(8,8,8,.96);

      border-top: 1px solid #e10606;
      border-bottom: 1px solid #e10606;

      padding: 4px 0;

      box-shadow: 0 4px 15px rgba(0,0,0,.6);
    }

    .ticker-track {
      display: flex;
      width: max-content;

      animation: tickerMove 14s linear infinite;
    }

    .ticker-text {
      flex-shrink: 0;

      color: white;

      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;

      padding-right: 40px;
    }

    @keyframes tickerMove {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }


    /* =========================
       LOGO
    ========================= */

    .hero-image {
      width: min(140px, 45vw);
      aspect-ratio: 1 / 1;

      margin: 22px auto 22px;

      border-radius: 20px;
      overflow: hidden;

      background: rgba(0,0,0,.55);

      border: 1px solid rgba(255,255,255,.15);

      box-shadow:
        0 8px 25px rgba(0,0,0,.7);
    }

    .hero-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;
    }


    /* =========================
       SÉPARATION
    ========================= */

    .separator {
      width: 70%;
      height: 1px;

      margin: 0 auto 20px;

      background: linear-gradient(
        to right,
        transparent,
        #e10606,
        transparent
      );

      box-shadow: 0 0 8px rgba(225,6,6,.7);
    }


    /* =========================
       CATÉGORIES
    ========================= */

    .categories {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 14px;
    }

    .category-card {
      aspect-ratio: 1 / 1;

      border-radius: 20px;

      overflow: hidden;
      position: relative;

      background: rgba(15,15,18,.9);

      border: 1px solid rgba(255,255,255,.18);

      box-shadow:
        0 8px 25px rgba(0,0,0,.65);

      cursor: pointer;

      transition: transform .2s ease;
    }

    .category-card:active {
      transform: scale(.97);
    }


    /* IMAGE PLACEHOLDER */

    .category-image {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.08),
          rgba(0,0,0,.7)
        );
    }

    .category-image span {
      font-size: 42px;
      opacity: .25;
    }


    /* FILTRE SUR LES IMAGES */

    .category-card::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          transparent 35%,
          rgba(0,0,0,.9)
        );

      pointer-events: none;
    }


    /* TITRES CATÉGORIES */

    .category-title {
      position: absolute;

      z-index: 2;

      bottom: 14px;
      left: 10px;
      right: 10px;

      text-align: center;

      font-size: 16px;
      font-weight: 900;

      letter-spacing: 1px;

      text-shadow:
        0 3px 10px black;
    }


    /* TROISIÈME CASE */

    .category-card.last {
      grid-column: span 2;

      aspect-ratio: 2 / 1;
    }


    /* =========================
       AUTRES PAGES
    ========================= */

    .page {
      display: none;

      min-height: 100vh;

      padding: 20px 15px 100px;
    }

    .page.active {
      display: block;
    }

    .page h1 {
      text-align: center;

      letter-spacing: 2px;
    }

    .page-box {
      margin-top: 15px;

      padding: 20px;

      border-radius: 20px;

      background: rgba(5,5,8,.9);

      border: 1px solid rgba(255,255,255,.18);

      backdrop-filter: blur(10px);
    }


    /* =========================
       MENU DU BAS
    ========================= */

    .bottom-menu {
      position: fixed;

      z-index: 100;

      bottom: 0;
      left: 0;

      width: 100%;
      height: 75px;

      display: flex;

      justify-content: space-around;
      align-items: center;

      background: rgba(8,8,10,.97);

      border-top:
        1px solid rgba(255,255,255,.15);

      backdrop-filter: blur(15px);
    }

    .bottom-menu button {
      flex: 1;

      background: none;
      border: none;

      color: white;

      font-size: 12px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 5px;

      cursor: pointer;
    }

    .bottom-menu .icon {
      font-size: 21px;
    }


    hr {
      border: none;

      border-top:
        1px solid rgba(255,255,255,.15);

      margin: 20px 0;
    }

  </style>
</head>
